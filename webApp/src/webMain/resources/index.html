<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AulaAir · Controlador Docente Hands-Free (MediaPipe + KMP)</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
    <!-- MediaPipe Hands & Drawing Utils CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #050811;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        #compose-root {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #compose-root > div,
        #compose-root canvas {
            width: 100% !important;
            height: 100% !important;
        }
        /* Floating Picture-in-Picture Teacher Webcam Feed */
        #aulaair-cam-pip {
            position: fixed;
            bottom: 18px;
            right: 22px;
            width: 220px;
            height: 145px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid #00F5D4;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.75), 0 0 18px rgba(0, 245, 212, 0.25);
            background: #080F1E;
            z-index: 9999;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        #aulaair-cam-pip:hover {
            transform: scale(1.04);
        }
        #aulaair-video {
            display: none;
        }
        #aulaair-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #aulaair-cam-badge {
            position: absolute;
            top: 6px;
            left: 8px;
            right: 8px;
            background: rgba(5, 8, 17, 0.86);
            color: #00F5D4;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 7px;
            border-radius: 6px;
            border: 1px solid rgba(0, 245, 212, 0.4);
            letter-spacing: 0.4px;
            text-align: left;
            pointer-events: none;
        }
    </style>
</head>
<body>
<!-- Dedicated Compose Multiplatform Viewport Container (not body!) -->
<div id="compose-root">
    <div style="display:flex;align-items:center;justify-content:center;width:100vw;height:100vh;color:#00F5D4;font-size:14px;">
        Cargando Atril Docente AulaAir...
    </div>
</div>

<!-- Persistent Live Webcam PiP Monitor outside #compose-root -->
<div id="aulaair-cam-pip" onclick="window.startAulaAirCamera(true)" title="Haz clic para activar o reiniciar la cámara">
    <video id="aulaair-video" playsinline muted autoplay></video>
    <canvas id="aulaair-canvas" width="320" height="210"></canvas>
    <div id="aulaair-cam-badge">📷 CLICK O PERMISO PARA CÁMARA</div>
</div>

<script>
    window.__aulaAirHandState = {
        cameraReady: false,
        handDetected: false,
        landmarks: []
    };

    window.startAulaAirCamera = async function(forceRetry) {
        if (window.__aulaAirCameraStarted && !forceRetry) return;
        window.__aulaAirCameraStarted = true;

        const videoElement = document.getElementById('aulaair-video');
        const canvasElement = document.getElementById('aulaair-canvas');
        const badgeElement = document.getElementById('aulaair-cam-badge');
        const pipBox = document.getElementById('aulaair-cam-pip');
        if (!videoElement || !canvasElement || !badgeElement) return;
        const canvasCtx = canvasElement.getContext('2d');

        try {
            badgeElement.textContent = "⏳ SOLICITANDO WEBCAM...";
            badgeElement.style.color = "#38BDF8";

            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" },
                audio: false
            });
            videoElement.srcObject = stream;
            await videoElement.play();
            window.__aulaAirHandState.cameraReady = true;
            badgeElement.textContent = "🟡 CARGANDO MEDIAPIPE HANDS...";

            if (typeof Hands === "undefined") {
                // Fallback: draw raw webcam if Brave Shields blocked CDN
                badgeElement.textContent = "📷 WEBCAM ACTIVA (DESACTIVA BRAVE SHIELDS PARA IA)";
                function renderRaw() {
                    if (videoElement.readyState >= 2) {
                        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                    }
                    requestAnimationFrame(renderRaw);
                }
                requestAnimationFrame(renderRaw);
                return;
            }

            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.6,
                minTrackingConfidence: 0.6
            });

            hands.onResults((results) => {
                window.__aulaAirHandState.cameraReady = true;
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    window.__aulaAirHandState.handDetected = true;
                    window.__aulaAirHandState.landmarks = lm;
                    badgeElement.textContent = "🟢 MANO DETECTADA (21 NODOS)";
                    badgeElement.style.color = "#00F5D4";
                    pipBox.style.borderColor = "#00F5D4";

                    if (window.drawConnectors && window.HAND_CONNECTIONS) {
                        drawConnectors(canvasCtx, lm, HAND_CONNECTIONS, {color: '#38BDF8', lineWidth: 2.5});
                        drawLandmarks(canvasCtx, lm, {color: '#00F5D4', lineWidth: 1, radius: 3});
                    }
                } else {
                    window.__aulaAirHandState.handDetected = false;
                    badgeElement.textContent = "🟡 MUESTRA TU MANO A LA CÁMARA";
                    badgeElement.style.color = "#F59E0B";
                    pipBox.style.borderColor = "#38BDF8";
                }
                canvasCtx.restore();
            });

            async function detectFrame() {
                if (videoElement.readyState >= 2) {
                    try {
                        await hands.send({ image: videoElement });
                    } catch (err) {
                        canvasCtx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
                    }
                }
                requestAnimationFrame(detectFrame);
            }
            requestAnimationFrame(detectFrame);
        } catch (err) {
            console.warn("Permiso de cámara pendiente o denegado:", err);
            window.__aulaAirCameraStarted = false;
            badgeElement.textContent = "📷 HAZ CLIC AQUÍ PARA ACTIVAR WEBCAM";
            badgeElement.style.color = "#EC4899";
            pipBox.style.borderColor = "#EC4899";
        }
    };

    window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => window.startAulaAirCamera(false), 600);
    });
</script>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
